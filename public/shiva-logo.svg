<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Double Circular Border -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <circle cx="100" cy="100" r="91" fill="none" stroke="#111827" stroke-width="1.2" stroke-dasharray="2,2" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#111827" stroke-width="1.5" />

  <!-- Lord Shiva Medallion Silhouette & Linework -->
  <g fill="none" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crescent Moon (Chandra) on hair -->
    <path d="M 68 46 C 72 40 80 40 82 48 C 76 46 72 48 70 54 C 68 50 67 48 68 46 Z" fill="#111827" />

    <!-- Trishul (Trident) at left side -->
    <path d="M 50 85 L 50 155" stroke-width="2.5" />
    <path d="M 50 85 L 50 48" stroke-width="2" />
    <path d="M 40 60 C 40 76 50 78 50 78 C 50 78 60 76 60 60" stroke-width="2" />
    <path d="M 40 60 L 37 54" stroke-width="2" />
    <path d="M 60 60 L 63 54" stroke-width="2" />
    <path d="M 50 48 L 47 54 L 53 54 Z" fill="#111827" stroke-width="1" />
    <!-- Damru on Trident -->
    <path d="M 44 86 L 56 94 L 44 94 L 56 86 Z" fill="#111827" stroke-width="1" />

    <!-- Matted Hair / Jata Crown -->
    <path d="M 85 45 C 95 32 115 32 125 45 C 132 54 135 65 132 75 C 128 72 120 70 115 72" stroke-width="2" fill="#111827" />
    <path d="M 90 48 C 98 42 112 42 120 48" stroke-width="2" stroke="#ffffff" />
    <path d="M 95 55 C 102 50 112 50 118 55" stroke-width="1.5" stroke="#ffffff" />
    <path d="M 100 35 C 105 28 112 30 112 38" stroke-width="2" />

    <!-- Holy River Ganga Flow Accent -->
    <path d="M 112 34 C 118 28 126 30 128 36" stroke-width="1.5" />

    <!-- Face Profile / Front Contour -->
    <path d="M 105 68 C 118 68 126 76 128 90 C 130 102 124 115 118 125 C 112 135 102 142 92 144" stroke-width="2" />
    <path d="M 88 68 C 82 78 80 92 82 105 C 84 118 90 132 100 142" stroke-width="2" />

    <!-- Serene Meditative Eyes & Brows -->
    <path d="M 92 84 C 96 82 102 82 106 85" stroke-width="1.8" />
    <path d="M 93 88 C 97 91 103 91 106 88" stroke-width="1.8" />
    <!-- Third Eye (Trinetra) -->
    <path d="M 107 76 C 109 72 111 72 113 76 C 111 80 109 80 107 76 Z" fill="#111827" stroke-width="1" />
    <!-- Tripundra (Three Sacred Ash Lines on Forehead) -->
    <path d="M 98 73 L 118 73" stroke-width="1.2" />
    <path d="M 97 76 L 105 76 M 115 76 L 120 76" stroke-width="1.2" />
    <path d="M 99 79 L 117 79" stroke-width="1.2" />

    <!-- Nose and Lips -->
    <path d="M 108 86 L 112 98 L 106 102" stroke-width="1.6" />
    <path d="M 104 108 C 108 111 114 111 116 108" stroke-width="1.6" />
    <path d="M 106 113 C 109 115 113 115 115 113" stroke-width="1.2" />

    <!-- Ear & Kundala (Earring) -->
    <path d="M 85 92 C 82 95 82 104 86 107" stroke-width="1.5" />
    <circle cx="85" cy="110" r="3" fill="#111827" />

    <!-- Vasuki Snake (Serpent coiled around Neck) -->
    <path d="M 88 126 C 96 122 114 122 122 128 C 126 132 126 138 120 142 C 112 146 95 146 88 140" stroke-width="3" />
    <!-- Snake Hood -->
    <path d="M 126 126 C 132 122 136 125 134 132 C 132 136 128 135 126 132 Z" fill="#111827" />
    <circle cx="131" cy="126" r="1" fill="#ffffff" />

    <!-- Rudraksha Necklace Beads -->
    <g fill="#111827" stroke="none">
      <circle cx="85" cy="142" r="2.5" />
      <circle cx="92" cy="147" r="2.5" />
      <circle cx="100" cy="150" r="2.5" />
      <circle cx="108" cy="150" r="2.5" />
      <circle cx="116" cy="147" r="2.5" />
      <circle cx="123" cy="142" r="2.5" />
    </g>

    <!-- Shoulders & Torso Drape -->
    <path d="M 72 158 C 80 145 90 142 100 144 C 112 142 124 146 134 158" stroke-width="2.5" />
    <path d="M 60 172 C 68 160 80 156 95 158" stroke-width="2" />
    <path d="M 145 172 C 138 160 126 156 112 158" stroke-width="2" />
  </g>
</svg>
