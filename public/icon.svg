<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle decorative inner border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Document / Bill Card -->
  <g filter="url(#shadow)">
    <rect x="116" y="110" width="280" height="300" rx="20" fill="#ffffff" />
    <!-- Bill Header Lines -->
    <rect x="146" y="146" width="130" height="18" rx="9" fill="#0284c7" />
    <rect x="146" y="174" width="80" height="10" rx="5" fill="#94a3b8" />
    <line x1="146" y1="204" x2="366" y2="204" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Bill Table Lines -->
    <rect x="146" y="222" width="140" height="12" rx="6" fill="#64748b" />
    <rect x="316" y="222" width="50" height="12" rx="6" fill="#0284c7" />
    
    <rect x="146" y="248" width="110" height="10" rx="5" fill="#cbd5e1" />
    <rect x="326" y="248" width="40" height="10" rx="5" fill="#64748b" />
    
    <rect x="146" y="272" width="130" height="10" rx="5" fill="#cbd5e1" />
    <rect x="326" y="272" width="40" height="10" rx="5" fill="#64748b" />
    
    <line x1="146" y1="302" x2="366" y2="302" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    
    <!-- Total Pill -->
    <rect x="250" y="320" width="116" height="28" rx="8" fill="#e0f2fe" />
    <rect x="264" y="328" width="88" height="12" rx="6" fill="#0284c7" />
  </g>

  <!-- Pipe Wrench Overlay Emblem -->
  <g transform="translate(90, 220) rotate(-28)" filter="url(#shadow)">
    <rect x="0" y="70" width="220" height="28" rx="14" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
    <!-- Wrench head -->
    <path d="M 180,50 L 250,50 L 250,118 L 180,118 Z" fill="#475569" stroke="#ffffff" stroke-width="4"/>
    <path d="M 210,30 L 270,30 L 270,60 L 240,60 Z" fill="#334155" />
    <rect x="195" y="80" width="18" height="8" rx="2" fill="#94a3b8" />
  </g>

  <!-- Water Drop Badge -->
  <circle cx="360" cy="140" r="32" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <path d="M 360,122 C 360,122 344,142 344,152 C 344,161 351,168 360,168 C 369,168 376,161 376,152 C 376,142 360,122 360,122 Z" fill="#ffffff" />
</svg>
